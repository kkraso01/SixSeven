[api]
# Base URL for the API endpoint
# Using /v1 endpoint which proxies to local Ollama's /v1/
#base_url = https://your-api-server.com/v1
base_url = http://localhost:11434/v1

# API mode: "ollama" or "openai"
api_mode = ollama
# Google Gemini API key (get from https://aistudio.google.com/api_keys)
gemini_api_key = 

[debate]
# Maximum tokens per response
max_tokens = 900
# Number of debate rounds
rounds = 5
# Maximum CA/SA speaking slots per round (moderator can end earlier)
max_turns_per_round = 8
# Word limit per response
word_limit = 180
# Random seed for reproducibility (leave empty for random)
seed = 

[output]
# Directory for output artifacts
output_dir = 

[analysis]
# Whether to run analysis after debate
run_analysis = false
# Threshold for detecting opinion shifts
analysis_shift_threshold = 5
# Similarity method: "tfidf" or other supported methods
analysis_similarity_method = tfidf

# BERT-based emotion model (e.g., bhadresh-savani/bert-base-uncased-emotion)
# Note: First run will download approx 400MB
emotion_model = bhadresh-savani/bert-base-uncased-emotion

# Whether to overwrite existing advanced analysis results
overwrite = true

# Maximum number of runs to process in batch mode (empty = unlimited)
max_runs = 10

# Linguistic Lexicons (Comma-separated)
uncertainty_lexicon = may,might,could,perhaps,possibly,suggests,likely,potential,concern,concerns,reasonable,appears,seems,arguably,maybe,unclear,uncertain
strong_modality_lexicon = must,clearly,definitely,proves,demonstrates,cannot,never,always,undeniable,certainly,obviously,plainly,shows,confirms
weak_modality_lexicon = may,might,could,suggest,suggests,appears,seems,possibly,potential,perhaps,arguably

