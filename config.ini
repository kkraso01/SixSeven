[api]
# Base URL for the API endpoint
# Using /v1 endpoint which proxies to local Ollama's /v1/
#base_url = https://chatucy.cs.ucy.ac.cy/v1
base_url = http://localhost:11434/v1

# API mode: "ollama" or "openai"
api_mode = openai
# Google Gemini API key (get from https://aistudio.google.com/api_keys)
gemini_api_key = AIzaSyARO7O_G8BJ1Z1ZmRZn5YoMK7wtRlYYb-c

[models]
# Model configurations for each debate participant
moderator_model = gemma3:27b
conspiracy_model = gemma3:27b
scientific_model = gemma3:27b

# Temperature settings control randomness (0.0 = deterministic, 1.0 = very random)
moderator_temperature = 0.2
conspiracy_temperature = 0.6
scientific_temperature = 0.2

[debate]
# Maximum tokens per response
max_tokens = 900
# Number of debate rounds
rounds = 5
# Word limit per response
word_limit = 180
# Random seed for reproducibility (leave empty for random)
seed = 

[output]
# Directory for output artifacts
output_dir = artifacts

[analysis]
# Whether to run analysis after debate
run_analysis = false
# Threshold for detecting opinion shifts
analysis_shift_threshold = 5
# Similarity method: "tfidf" or other supported methods
analysis_similarity_method = tfidf

[history]
# History mode: "global_full" (all agents see full transcript), "per_agent" (each sees own), "memory_only" (legacy)
history_mode = global_full
# Include compact memory summary alongside history
include_memory_summary = true
# Trimming strategy: "none", "rounds", "messages", or "chars"
history_trim = rounds
# Maximum rounds to keep in history (empty = unlimited)
max_rounds_in_history = 3 
# Maximum messages to keep in history (empty = unlimited)
max_messages_in_history = 
# Maximum characters to keep in history (empty = unlimited)
max_chars_in_history = 
# Add moderator summary when history is trimmed
summarize_if_trimmed = true
# Highlight opponent's last message at end of prompt
highlight_opponent_last = true
